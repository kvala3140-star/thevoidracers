<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Void Racers: Pit Wall</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800&family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--bg:#0b0713;--surface:#150f24;--ink:#efe9ff;--mute:#a597c9;--line:#2c2147;--red:#ff4b6e;--green:#3ecf7c;--amber:#f0b429;--purple:#a35cff;--chip:#231a3a;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(ellipse at 50% -10%,#2a1260 0,transparent 60%);background-attachment:fixed;color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif}
.wrap{max-width:1600px;margin:0 auto;padding:20px 16px 48px}
h1,h2,.big{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:700;margin:0}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;border-bottom:4px solid var(--purple);padding-bottom:14px}
h1{font:800 clamp(22px,6vw,36px)/1.05 Orbitron,"Barlow Condensed",sans-serif;letter-spacing:.04em}.brand{display:flex;gap:14px;align-items:center}.logo{width:84px;height:84px;border-radius:10px;border:1px solid var(--line);object-fit:cover}
.sub{color:var(--mute);margin:4px 0 0}
.count{text-align:right}.big{font-size:56px;line-height:.9;color:var(--purple)}
label{display:block;font-size:13px;color:var(--mute);font-weight:600}
input,select,button{font:inherit;color:var(--ink)}
input,select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
button{cursor:pointer;border-radius:6px;border:1px solid var(--purple);background:var(--surface);padding:8px 14px;font-weight:600}
button.primary{background:var(--purple);color:#fff;border-color:var(--purple)}
:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:16px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.stat b{display:block;font:700 28px/1 "Barlow Condensed",sans-serif}.stat span{font-size:13px;color:var(--mute)}
.track{position:relative;height:44px;margin:8px 0 22px;border-top:2px dashed var(--line);border-bottom:2px dashed var(--line);background:repeating-linear-gradient(90deg,transparent 0 11px,var(--chip) 11px 12px)}
.tick{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--purple);border:2px solid var(--surface)}
.tick.done{background:var(--green)}.tick.late{background:var(--red)}
.flag{position:absolute;right:0;top:-2px;bottom:-2px;width:14px;background:repeating-conic-gradient(var(--ink) 0 25%,var(--surface) 0 50%) 0 0/7px 7px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:16px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 10px;align-items:center}
.bar button[aria-pressed="true"]{background:var(--purple);color:#fff}
ul{list-style:none;margin:0;padding:0}
li.task{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--purple);border-radius:6px;padding:10px 12px;margin-bottom:8px}
li.task.done{border-left-color:var(--green);opacity:.65}li.task.done .t{text-decoration:line-through}
li.task.late{border-left-color:var(--red)}li.task.soon{border-left-color:var(--amber)}
.t{font-weight:600}.meta{font-size:13px;color:var(--mute)}
.chip{display:inline-block;background:var(--chip);border-radius:99px;padding:0 8px;font-size:12px;margin-right:6px;color:var(--ink)}
.due{text-align:right;font-size:14px;white-space:nowrap}.due b{display:block}
.late .due b{color:var(--red)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--green)}
.del{border:0;background:none;color:var(--mute);padding:2px 6px;font-size:13px;font-weight:500}
.pk{display:inline-flex;align-items:center;gap:6px;margin:4px 14px 4px 0;color:var(--ink)}.pk input{width:18px;height:18px;accent-color:var(--purple)}.pr{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;margin-top:8px}.pbar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--purple)}.pbar.ok i{background:var(--green)}.step{padding:0 10px;min-width:34px;font-size:18px;line-height:1.4}.cnt{display:inline-block;min-width:44px;text-align:center;font-weight:700}
.empty{padding:24px;text-align:center;color:var(--mute);border:2px dashed var(--line);border-radius:6px}

.banner{background:linear-gradient(90deg,#3b1a7a,#1d1236);border:1px solid var(--purple);border-radius:6px;padding:10px 14px;margin:14px 0 0}
.pri-High{background:var(--red);color:#12060a;font-weight:700}
.post{border-top:1px solid var(--line);padding:8px 0}
.panel h2{font-size:22px;margin-bottom:6px}
.g-High{--c:#ff4b6e}.g-Normal{--c:#a35cff}.g-Low{--c:#35c4d8}
.gscroll{overflow-x:auto}
.gr{display:grid;grid-template-columns:190px 1fr;align-items:center;border-top:1px solid var(--line)}
.gl{position:sticky;left:0;z-index:2;background:var(--surface);font-size:14px;padding:6px 8px 6px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gl.dn{opacity:.55;text-decoration:line-through}
.gt{position:relative;height:40px;background-image:linear-gradient(90deg,var(--line) 1px,transparent 1px)}
.gb{position:absolute;top:10px;height:20px;border-radius:5px;overflow:hidden;background:color-mix(in srgb,var(--c,#a35cff) 28%,transparent);border:1px solid var(--c,#a35cff)}
.gb:hover{filter:brightness(1.35)}.gb i{display:block;height:100%;background:var(--c,#a35cff)}
.gtoday,.gev{position:absolute;top:0;bottom:0;width:2px;z-index:1}.gtoday{background:var(--amber)}.gev{background:var(--ink)}
.gw{position:absolute;top:3px;font-size:11px;color:var(--mute);transform:translateX(3px);white-space:nowrap}
.gleg{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;margin:6px 0 10px;color:var(--mute)}
.gk{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
#gantt.full{position:fixed;inset:0;z-index:50;margin:0;border-radius:0;overflow:auto;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 24px}
#gantt.full .gt{height:54px}#gantt.full .gb{top:14px;height:26px}#gantt.full .gl{font-size:16px}
/* ---- liveliness ---- */
@keyframes drift{to{background-position:-600px 400px,300px -500px}}
@keyframes glow{0%,100%{box-shadow:0 0 12px #a35cff55}50%{box-shadow:0 0 30px #a35cffcc}}
@keyframes shine{to{background-position:-200% 0}}
@keyframes pulse{50%{text-shadow:0 0 24px #a35cff}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes pop{40%{transform:scale(1.6);color:var(--purple)}}
@keyframes blink{50%{transform:scale(1.35)}}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.6;background-image:radial-gradient(2px 2px at 20px 30px,#cbb3ff,transparent),radial-gradient(1.5px 1.5px at 120px 90px,#fff,transparent);background-size:240px 200px,310px 260px;animation:drift 90s linear infinite}
.logo{animation:glow 3s ease-in-out infinite}
h1{background:linear-gradient(90deg,#fff,#c9a6ff,#fff);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:shine 6s linear infinite}
.big{animation:pulse 2.5s ease-in-out infinite}
.tick{animation:blink 2.2s ease-in-out infinite}
li.task,.stat{transition:transform .15s,box-shadow .15s,border-color .15s}
li.task:hover,.stat:hover{transform:translateY(-2px);box-shadow:0 8px 26px #a35cff33;border-color:var(--purple)}
button{transition:filter .15s,transform .1s}button:hover{filter:brightness(1.2)}button:active{transform:scale(.94)}
.pbar i{background:linear-gradient(90deg,#7a3dff,#c9a6ff);transition:width .5s ease}.pbar.ok i{background:linear-gradient(90deg,#1a8a4a,#3ecf7c)}
.first li.task{animation:rise .45s both}.first li.task:nth-child(2){animation-delay:.07s}.first li.task:nth-child(3){animation-delay:.14s}.first li.task:nth-child(4){animation-delay:.21s}.first li.task:nth-child(5){animation-delay:.28s}.first li.task:nth-child(n+6){animation-delay:.35s}
.cnt.pop{animation:pop .4s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<body>
<div class="wrap">
<header>
  <div class="brand"><img class="logo" src="logo.png" alt="The Void Racers logo"><div><h1>The Void Racers</h1><p class="sub">Pit Wall: team deadline planner</p></div></div>
  <div class="count"><div class="big" id="days">–</div><div class="meta" id="daysLbl">Set your event date</div></div>
<div class="meta" id="who" style="width:100%"></div></header>
<div id="gate" class="panel"></div>
<div id="app" hidden>

<div class="banner" id="banner" hidden></div>
<div class="banner" id="next" hidden></div>
<div class="stats" id="stats"></div>
<div class="track" id="track" aria-hidden="true"><div class="flag"></div></div>
<div class="panel" id="board"></div>
<div class="bar" id="people" role="group" aria-label="Show tasks for"></div>
<div class="panel" id="gantt"></div>

<div class="panel">
  <div class="row">
    <div><label for="evName">Event</label><input id="evName" value="Regional final"></div>
    <div><label for="evDate">Event date</label><input id="evDate" type="date"></div>
    <div><button id="tpl" class="primary" style="width:100%">Load race-season template</button></div>
    <div><button id="csv" style="width:100%">Export CSV</button></div>
    <div style="grid-column:1/-1"><label for="ann">Team announcement (shown to everyone)</label><input id="ann" placeholder="e.g. Portfolio draft due Friday"></div>
  </div>
</div>

<form class="panel" id="f" onsubmit="return false">
  <div class="row">
    <div style="grid-column:1/-1;min-width:200px"><label for="nt">Task</label><input id="nt" placeholder="e.g. Finish CFD report"></div>
    <div><label for="nn">Count needed (e.g. 4 videos)</label><input id="nn" type="number" min="1" max="99" value="1"></div>
    <div style="grid-column:1/-1"><label>Send to (each person gets their own counter)</label><div id="pick"></div><button type="button" id="all" class="del" style="padding:0">Select everyone / none</button></div>
    <div><label for="np">Priority</label><select id="np"><option>Normal</option><option>High</option><option>Low</option></select></div>
    <div style="grid-column:1/-1"><label for="nx">Notes or link (optional)</label><input id="nx" placeholder="e.g. Watch the CFD tutorial playlist"></div>
    <div><label for="nc">Area</label><select id="nc"><option>Design &amp; CAD</option><option>Manufacturing</option><option>Testing</option><option>Portfolio</option><option>Enterprise</option><option>Presentation</option><option>Logistics</option></select></div>
    <div><label for="ns">Start date</label><input id="ns" type="date"></div>
    <div><label for="nd">Due date</label><input id="nd" type="date"></div>
    <div><button id="add" class="primary" style="width:100%">Add task</button></div>
  </div>
</form>

<div class="bar" id="filters" role="group" aria-label="Filter tasks"></div>
<div class="row" style="margin-bottom:10px"><div><input id="q" placeholder="Search tasks" aria-label="Search tasks"></div><div><select id="fa" aria-label="Filter by area"><option value="">All areas</option><option>Design &amp; CAD</option><option>Manufacturing</option><option>Testing</option><option>Portfolio</option><option>Enterprise</option><option>Presentation</option><option>Logistics</option></select></div><div><select id="fs" aria-label="Sort tasks"><option value="d">Sort: due date</option><option value="p">Sort: priority</option></select></div></div>
<div class="meta" id="msg" role="status"></div>
<ul id="list"></ul>
<div class="panel" id="chat"><h2>Team board</h2><div class="row"><div style="grid-column:1/-1"><label for="pt">Message the team</label><input id="pt" maxlength="300" placeholder="Share an update or ask for help"></div><div><button id="ps" class="primary" style="width:100%">Post</button></div></div><div id="posts"></div></div></div>
</div>

<script>
var ROSTER=["vkhahan","ialfarhan","vbudki","emusa","aputhoor"],LEAD="vkhahan",NAMES={vkhahan:"Vala Khahan",ialfarhan:"Ilyas Alfarhan",vbudki:"Vivaan Budki",emusa:"Ethan Musa",aputhoor:"Andrew Puthoor"};
function nm(u){return NAMES[u]||u}
var S={event:"Regional final",date:"",tasks:[],members:{},filter:"open",who:[]};
var ME={uid:null,name:null,owner:false},DB=null,armed=false,seeded=false;
var $=function(i){return document.getElementById(i)},DAY=864e5;
function today(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function diff(s){return Math.round((parse(s)-today())/DAY)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(s){return parse(s).toLocaleDateString(undefined,{day:"numeric",month:"short"})}
function rel(n){return n<0?Math.abs(n)+"d overdue":n===0?"Today":n===1?"Tomorrow":"In "+n+"d"}
function note(t){$("msg").textContent=t||""}
function err(e){note("Couldn’t sync: "+((e&&e.message)||e))}
function gate(h){$("gate").hidden=false;$("gate").innerHTML=h;$("app").hidden=true}

var TPL=[["Agree team roles and car identity","Enterprise",90],["Write design brief and regulation checklist","Design & CAD",84],["First CAD concept ready","Design & CAD",70],["CFD round 1 complete","Testing",60],["Send sponsorship proposals","Enterprise",60],["Print or machine prototype car","Manufacturing",45],["Track testing and data log","Testing",35],["Design freeze","Design & CAD",28],["Engineering portfolio draft","Portfolio",21],["Portfolio submission","Portfolio",14],["Pit display built","Enterprise",18],["Verbal presentation rehearsal","Presentation",10],["Scrutineering check on final car","Manufacturing",5],["Pack tools, spares and display","Logistics",2]];

$("pick").innerHTML=ROSTER.map(function(n){return'<label class="pk"><input type="checkbox" value="'+n+'"> '+NAMES[n]+'</label>'}).join("");

/* ---- PASTE YOUR FIREBASE CONFIG HERE (see README.md) ---- */
var firebaseConfig={apiKey:"AIzaSyDrDhcOI5JHv9czKUG0EU5XGzJRrkTOA9Q",authDomain:"thevoidracers-84d0d.firebaseapp.com",projectId:"thevoidracers-84d0d",appId:"1:857579521383:web:ff46966bc509e323311bc2"};
/* ---------------------------------------------------------- */
var DOMAIN="@tvracers.team",auth,unsubs=[];
function loginForm(msg){
  gate('<h2>Sign in</h2><form id="lf" class="row"><div><label for="lu">Username (e.g. vkhahan)</label><input id="lu" autocomplete="username" required></div><div><label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" required></div><div><button class="primary" style="width:100%">Sign in</button></div></form><p class="meta" id="lm" role="alert">'+(msg||"")+'</p>');
  $("lf").onsubmit=function(e){e.preventDefault();var u=$("lu").value.trim().toLowerCase().split("@")[0];
    if(ROSTER.indexOf(u)<0){$("lm").textContent="Unknown username.";return}
    auth.signInWithEmailAndPassword(u+DOMAIN,$("lp").value).catch(function(){$("lm").textContent="Wrong username or password."})};
}
function start(){
  if(firebaseConfig.apiKey.indexOf("PASTE")===0){gate("<h2>Setup needed</h2><p>Paste your Firebase config into index.html. See README.md.</p>");return}
  firebase.initializeApp(firebaseConfig);auth=firebase.auth();DB=firebase.firestore();
  auth.onAuthStateChanged(function(u){
    unsubs.forEach(function(f){f()});unsubs=[];
    if(!u){ME.name=null;loginForm();return}
    ME.name=u.email.split("@")[0];ME.owner=ME.name===LEAD;$("f").hidden=!ME.owner;
    $("gate").hidden=true;$("app").hidden=false;
    unsubs.push(DB.collection("tasks").onSnapshot(function(s){S.tasks=s.docs.map(function(d){var x=d.data();x.id=d.id;return x});render()},err));
    unsubs.push(DB.collection("posts").orderBy("at","desc").limit(30).onSnapshot(function(s){POSTS=s.docs.map(function(d){var x=d.data();x.id=d.id;return x});renderPosts()},err));
    unsubs.push(DB.doc("settings/event").onSnapshot(function(s){var x=s.data()||{};S.event=x.name||S.event;S.date=x.date||"";S.ann=x.announcement||"";if(document.activeElement!==$("ann"))$("ann").value=S.ann;if(document.activeElement!==$("evName"))$("evName").value=S.event;$("evDate").value=S.date;render()},err));
    render();
  });
}

$("evDate").onchange=function(){if(ME.owner)DB.doc("settings/event").set({name:S.event,date:this.value},{merge:true}).catch(err)};
$("evName").onchange=function(){if(ME.owner)DB.doc("settings/event").set({name:this.value,date:S.date},{merge:true}).catch(err)};
$("ann").onchange=function(){if(ME.owner)DB.doc("settings/event").set({announcement:this.value.trim()},{merge:true}).catch(err)};
$("tpl").onclick=function(){
  if(!ME.owner)return;
  if(!S.date){note("Set the event date first so deadlines can be counted back from it.");return}
  if(S.tasks.length&&!armed){armed=true;note("You already have tasks. Click again to add the template anyway.");return}
  armed=false;note("");
  TPL.forEach(function(t){DB.collection("tasks").add({t:t[0],assignees:[],target:1,progress:{},c:t[1],d:iso(new Date(parse(S.date).getTime()-t[2]*DAY)),s:iso(new Date(parse(S.date).getTime()-(t[2]+7)*DAY)),p:/freeze|submission|scrutineering/i.test(t[0])?"High":"Normal",done:false}).catch(err)})};
$("all").onclick=function(){var b=document.querySelectorAll("#pick input");var on=Array.prototype.every.call(b,function(c){return c.checked});Array.prototype.forEach.call(b,function(c){c.checked=!on})};
$("add").onclick=function(){
  var t=$("nt").value.trim();
  if(!t||!$("nd").value){note("Add a task name and a due date.");return}
  var sv=$("ns").value||iso(today());if(sv>$("nd").value){note("The start date must be on or before the due date.");return}
  var as=Array.prototype.filter.call(document.querySelectorAll("#pick input"),function(c){return c.checked}).map(function(c){return c.value});
  var n=Math.max(1,Math.min(99,parseInt($("nn").value,10)||1));
  note("");DB.collection("tasks").add({t:t,assignees:as,target:n,progress:{},s:sv,p:$("np").value,notes:$("nx").value.trim(),c:$("nc").value,d:$("nd").value,by:ME.name}).catch(err);
  $("nt").value="";$("nx").value="";$("nt").focus()};

var BUMP="",POSTS=[];
function link(s){return s.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener" style="color:var(--purple)">$1</a>')}
function fn(p){return p==="team"?"Whole team":nm(p).split(" ")[0]}
function sel(x){var P=parts(x);return S.who.length?P.filter(function(p){return S.who.indexOf(p)>=0}):P}
function showTask(x){return!S.who.length||sel(x).length>0}
function renderPeople(){
  var w=S.who;
  $("people").innerHTML='<span class="meta"><b>Show tasks for:</b></span><button data-w="*" aria-pressed="'+(!w.length)+'">Everyone</button>'+ROSTER.concat(["team"]).map(function(p){return'<button data-w="'+p+'" aria-pressed="'+(w.indexOf(p)>=0)+'">'+esc(fn(p))+'</button>'}).join("");
  Array.prototype.forEach.call($("people").querySelectorAll("button"),function(b){b.onclick=function(){var v=b.dataset.w;if(v==="*")S.who=[];else{var i=S.who.indexOf(v);if(i<0)S.who.push(v);else S.who.splice(i,1)}render()}});
}
function sd(x){return x.s||iso(new Date(parse(x.d).getTime()-6*DAY))}
function prog(x){var P=sel(x),t=tgt(x),s=0;P.forEach(function(p){s+=Math.min(cnt(x,p),t)});return s/(P.length*t)}
function renderGantt(T){
  var el=$("gantt");T=T.filter(showTask);var hd='<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>Gantt chart</h2><button id="gfs">'+(S.gfull?"Close":"Full screen")+'</button></div>';el.classList.toggle("full",!!S.gfull);document.body.style.overflow=S.gfull?"hidden":"";
  if(!T.length){el.innerHTML=hd+"<p class=\"meta\">"+(S.who.length?"No tasks for the selected people.":"Tasks will show up here as bars from their start date to their due date.")+"</p>";return}
  var R=T.slice().sort(function(a,b){var x=sd(a),y=sd(b);return x<y?-1:x>y?1:a.d<b.d?-1:1});
  var t0=parse(sd(R[0])),t1=parse(R[0].d),td=today(),ev=S.date?parse(S.date):null;
  R.forEach(function(x){var e=parse(x.d);if(e>t1)t1=e});
  if(td<t0)t0=td;if(td>t1)t1=td;if(ev){if(ev>t1)t1=ev;if(ev<t0)t0=ev}
  var N=Math.round((t1-t0)/DAY)+1,pc=function(d){return Math.round((d-t0)/DAY)/N*100};
  var head="";for(var i=0;i<N;i+=7)head+='<span class="gw" style="left:'+(i/N*100)+'%">'+fmt(iso(new Date(t0.getTime()+i*DAY)))+'</span>';
  var lines=(td>=t0&&td<=t1?'<span class="gtoday" style="left:'+pc(td)+'%" title="Today"></span>':"")+(ev&&ev>=t0&&ev<=t1?'<span class="gev" style="left:'+pc(ev)+'%" title="'+esc(S.event)+'"></span>':"");
  var rows=R.map(function(x){var s=parse(sd(x)),e=parse(x.d),w=Math.max((Math.round((e-s)/DAY)+1)/N*100,1.2),p=Math.round(prog(x)*100),pri=x.p||"Normal";
    var tip=x.t+" ("+pri+" priority): "+fmt(sd(x))+" to "+fmt(x.d)+", "+p+"% done";
    return'<div class="gr"><div class="gl'+(sel(x).every(function(p){return cnt(x,p)>=tgt(x)})?" dn":"")+'" title="'+esc(tip)+'">'+esc(x.t)+'<br><span class="meta" style="font-size:11px">'+esc(sel(x).map(fn).join(", "))+'</span></div><div class="gt" style="background-size:'+(7/N*100)+'% 100%">'+lines+'<div class="gb g-'+pri+'" style="left:'+pc(s)+'%;width:'+w+'%" title="'+esc(tip)+'"><i style="width:'+p+'%"></i></div></div></div>'}).join("");
  var leg='<div class="gleg"><span class="g-High"><i class="gk"></i>High priority</span><span class="g-Normal"><i class="gk"></i>Normal</span><span class="g-Low"><i class="gk"></i>Low</span><span><i class="gk" style="background:var(--amber);width:3px"></i>Today</span><span><i class="gk" style="background:var(--ink);width:3px"></i>Event</span><span>Solid part of a bar = progress</span></div>';
  el.innerHTML=hd+leg+'<div class="gscroll"><div style="min-width:'+(Math.max(720,N*9)+190)+'px"><div class="gr"><div class="gl"></div><div class="gt" style="height:22px;background:none">'+head+'</div></div>'+rows+"</div></div>";
}
function pr(x){return x.p==="High"?0:x.p==="Low"?2:1}
function burst(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  var c=document.createElement("canvas");c.style.cssText="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99";c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);
  var g=c.getContext("2d"),P=[],cols=["#a35cff","#c9a6ff","#ffffff","#3ecf7c","#f0b429"],t=0;
  for(var i=0;i<100;i++)P.push({x:innerWidth/2,y:innerHeight*.6,vx:(Math.random()-.5)*15,vy:-Math.random()*15-4,s:Math.random()*6+4,c:cols[i%5],r:Math.random()*6});
  (function f(){g.clearRect(0,0,c.width,c.height);
    P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.r+=.2;g.fillStyle=p.c;g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);g.restore()});
    if(++t<110)requestAnimationFrame(f);else c.remove()})();
}
function parts(x){return x.assignees&&x.assignees.length?x.assignees:["team"]}
function cnt(x,p){return(x.progress&&x.progress[p])||0}
function tgt(x){return x.target||1}
function isDone(x){return parts(x).every(function(p){return cnt(x,p)>=tgt(x)})}
function who(p){return p==="team"?"Whole team":nm(p)}

function render(){
  if(!ME.name)return;
  var n=S.date?diff(S.date):null;
  $("days").textContent=n===null?"–":n<0?"Done":n;
  $("daysLbl").textContent=n===null?"Waiting for the event date":n<0?S.event+" has passed":"days to "+S.event;
  $("evName").closest(".panel").hidden=!ME.owner;if(!$("ns").value)$("ns").value=iso(today());$("f").hidden=!ME.owner;
  $("who").innerHTML="Signed in as <b>"+esc(nm(ME.name))+"</b>"+(ME.owner?" (owner)":"")+' · <button class="del" id="out">Sign out</button>';
  $("out").onclick=function(){auth.signOut().then(function(){location.reload()})};
  var T=S.tasks,done=T.filter(isDone).length;
  var late=T.filter(function(x){return!isDone(x)&&diff(x.d)<0}).length;
  var week=T.filter(function(x){var k=diff(x.d);return!isDone(x)&&k>=0&&k<=7}).length;
  $("stats").innerHTML=[[T.length?Math.round(done/T.length*100)+"%":"0%","Complete"],[T.length-done,"Open tasks"],[week,"Due in 7 days"],[late,"Overdue"]].map(function(s){return'<div class="stat"><b>'+s[0]+'</b><span>'+s[1]+'</span></div>'}).join("");
  var start=today(),end=S.date?parse(S.date):null,tk="";
  if(end&&end>start){T.forEach(function(x){var p=Math.min(100,Math.max(0,(parse(x.d)-start)/(end-start)*100));tk+='<span class="tick'+(isDone(x)?" done":diff(x.d)<0?" late":"")+'" style="left:'+p+'%" title="'+esc(x.t)+'"></span>'})}
  $("track").innerHTML='<div class="flag"></div>'+tk;
  $("banner").hidden=!S.ann;$("banner").innerHTML="<b>Announcement</b> "+link(esc(S.ann||""));
  var mine=T.filter(function(x){return parts(x).indexOf(ME.name)>=0&&cnt(x,ME.name)<tgt(x)}).sort(function(a,b){return a.d<b.d?-1:1})[0],hasAny=T.some(function(x){return parts(x).indexOf(ME.name)>=0});
  $("next").hidden=!hasAny;
  $("next").innerHTML=mine?"<b>Your next task:</b> "+esc(mine.t)+" ("+cnt(mine,ME.name)+"/"+tgt(mine)+"), "+rel(diff(mine.d)).toLowerCase():"<b>You’re all caught up.</b> Nice work.";
  var B=ROSTER.map(function(n){var d=0,t=0;T.forEach(function(x){if(parts(x).indexOf(n)>=0){d+=Math.min(cnt(x,n),tgt(x));t+=tgt(x)}});return{n:n,d:d,t:t,pc:t?Math.round(d/t*100):0}}).sort(function(a,b){return b.pc-a.pc||b.d-a.d});
  $("board").innerHTML="<h2>Team progress</h2>"+B.map(function(r,i){return'<div class="pr"><span class="meta"><b>'+esc(nm(r.n))+'</b>'+(i===0&&r.pc>0?' <span class="chip">Leading</span>':"")+'</span><div class="pbar'+(r.t&&r.pc>=100?" ok":"")+'"><i style="width:'+r.pc+'%"></i></div><span class="cnt">'+(r.t?r.d+"/"+r.t:"–")+'</span></div>'}).join("");
  var F=[["open","Open"],["mine","Mine"],["late","Overdue"],["done","Done"],["all","All"]];
  $("filters").innerHTML=F.map(function(f){return'<button data-f="'+f[0]+'" aria-pressed="'+(S.filter===f[0])+'">'+f[1]+'</button>'}).join("");
  Array.prototype.forEach.call($("filters").children,function(b){b.onclick=function(){S.filter=b.dataset.f;render()}});
  var q=$("q").value.trim().toLowerCase(),fa=$("fa").value;
  var L=T.slice().sort(function(a,b){if($("fs").value==="p"&&pr(a)!==pr(b))return pr(a)-pr(b);return a.d<b.d?-1:a.d>b.d?1:0}).filter(function(x){if(!showTask(x))return false;if(fa&&x.c!==fa)return false;if(q&&((x.t||"")+" "+(x.notes||"")).toLowerCase().indexOf(q)<0)return false;var f=S.filter,d=isDone(x);
    return f==="all"||(f==="open"&&!d)||(f==="done"&&d)||(f==="late"&&!d&&diff(x.d)<0)||(f==="mine"&&parts(x).indexOf(ME.name)>=0&&cnt(x,ME.name)<tgt(x))});
  $("list").className=S.rendered?"":"first";
  $("list").innerHTML=L.length?L.map(function(x){var k=diff(x.d),d=isDone(x),t=tgt(x);
    var cls="task"+(d?" done":k<0?" late":k<=7?" soon":"");
    var rows=sel(x).map(function(p){var c=cnt(x,p),can=ME.owner||p===ME.name||p==="team";
      return'<div class="pr"><span class="meta"><b>'+esc(who(p))+'</b></span><div class="pbar'+(c>=t?" ok":"")+'"><i style="width:'+Math.min(100,c/t*100)+'%"></i></div><span>'
      +(can?'<button class="step" data-id="'+x.id+'" data-p="'+p+'" data-d="-1" aria-label="Subtract one for '+esc(who(p))+'">−</button>':"")
      +'<span class="cnt'+(BUMP===x.id+p?" pop":"")+'">'+c+'/'+t+'</span>'
      +(can?'<button class="step" data-id="'+x.id+'" data-p="'+p+'" data-d="1" aria-label="Add one for '+esc(who(p))+'">+</button>':"")+'</span></div>'}).join("");
    return'<li class="'+cls+'"><div><div class="t">'+esc(x.t)+'</div><div class="meta"><span class="chip">'+esc(x.c)+'</span>'+(x.p==="High"?'<span class="chip pri-High">High priority</span>':x.p==="Low"?'<span class="chip">Low priority</span>':"")+(ME.owner?'<button class="del" data-del="'+x.id+'">Delete</button>':"")+'</div>'+(x.notes?'<div class="meta">'+link(esc(x.notes))+'</div>':"")+rows+'</div>'
    +'<div class="due"><b>'+(d?"Done":rel(k))+'</b>'+fmt(x.d)+'</div></li>'}).join("")
    :'<li class="empty">'+(T.length?"Nothing here. Try another filter.":"No tasks yet. "+(ME.owner?"Set the event date and load the template, or add the first task above.":"vkhahan will add tasks here."))+'</li>';
  Array.prototype.forEach.call(document.querySelectorAll("[data-d]"),function(b){b.onclick=function(){
    var x=S.tasks.filter(function(y){return y.id===b.dataset.id})[0];if(!x)return;
    var v=Math.max(0,Math.min(tgt(x),cnt(x,b.dataset.p)+(+b.dataset.d)));var o={};o["progress."+b.dataset.p]=v;
    BUMP=b.dataset.id+b.dataset.p;if(+b.dataset.d>0&&v>=tgt(x)&&cnt(x,b.dataset.p)<tgt(x))burst();
    DB.doc("tasks/"+b.dataset.id).update(o).catch(err)}});
  Array.prototype.forEach.call(document.querySelectorAll("[data-del]"),function(b){b.onclick=function(){DB.doc("tasks/"+b.dataset.del).delete().catch(err)}});
  BUMP="";S.rendered=true;renderPeople();renderGantt(T);
}
function renderPosts(){
  if(!ME.name)return;
  $("posts").innerHTML=POSTS.map(function(p){return'<div class="post"><b>'+esc(nm(p.by))+'</b> <span class="meta">'+new Date(p.at).toLocaleString(undefined,{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})+(ME.owner?' <button class="del" data-dp="'+p.id+'">Delete</button>':"")+'</span><div>'+link(esc(p.text))+'</div></div>'}).join("")||'<p class="meta">No messages yet.</p>';
  Array.prototype.forEach.call(document.querySelectorAll("[data-dp]"),function(b){b.onclick=function(){DB.doc("posts/"+b.dataset.dp).delete().catch(err)}});
}
$("ps").onclick=function(){var t=$("pt").value.trim();if(!t)return;DB.collection("posts").add({by:ME.name,text:t,at:Date.now()}).catch(err);$("pt").value=""};
$("pt").onkeydown=function(e){if(e.key==="Enter")$("ps").click()};
["q","fa","fs"].forEach(function(i){$(i).oninput=function(){render()}});
$("csv").onclick=function(){
  if(!ME.owner)return;
  var R=[["Task","Area","Priority","Due","Target","Person","Progress"]];
  S.tasks.forEach(function(x){parts(x).forEach(function(p){R.push([x.t,x.c,x.p||"Normal",x.d,tgt(x),who(p),cnt(x,p)])})});
  var csv=R.map(function(r){return r.map(function(v){return'"'+String(v).replace(/"/g,'""')+'"'}).join(",")}).join("\n");
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="void-racers-tasks.csv";a.click();
};
$("gantt").addEventListener("click",function(e){if(e.target.id==="gfs"){S.gfull=!S.gfull;render()}});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&S.gfull){S.gfull=false;render()}});
start();
</script>
</body>
