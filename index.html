<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Void Racers: Pit Wall</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800&family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--bg:#0b0713;--surface:#150f24;--ink:#efe9ff;--mute:#a597c9;--line:#2c2147;--red:#ff4b6e;--green:#3ecf7c;--amber:#f0b429;--purple:#a35cff;--chip:#231a3a;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(ellipse at 50% -10%,#2a1260 0,transparent 60%);background-attachment:fixed;color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 48px}
h1,h2,.big{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:700;margin:0}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;border-bottom:4px solid var(--purple);padding-bottom:14px}
h1{font:800 clamp(22px,6vw,36px)/1.05 Orbitron,"Barlow Condensed",sans-serif;letter-spacing:.04em}.brand{display:flex;gap:14px;align-items:center}.logo{width:84px;height:84px;border-radius:10px;border:1px solid var(--line);object-fit:cover}
.sub{color:var(--mute);margin:4px 0 0}
.count{text-align:right}.big{font-size:56px;line-height:.9;color:var(--purple)}
label{display:block;font-size:13px;color:var(--mute);font-weight:600}
input,select,button{font:inherit;color:var(--ink)}
input,select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
button{cursor:pointer;border-radius:6px;border:1px solid var(--purple);background:var(--surface);padding:8px 14px;font-weight:600}
button.primary{background:var(--purple);color:#fff;border-color:var(--purple)}
:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:16px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.stat b{display:block;font:700 28px/1 "Barlow Condensed",sans-serif}.stat span{font-size:13px;color:var(--mute)}
.track{position:relative;height:44px;margin:8px 0 22px;border-top:2px dashed var(--line);border-bottom:2px dashed var(--line);background:repeating-linear-gradient(90deg,transparent 0 11px,var(--chip) 11px 12px)}
.tick{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--purple);border:2px solid var(--surface)}
.tick.done{background:var(--green)}.tick.late{background:var(--red)}
.flag{position:absolute;right:0;top:-2px;bottom:-2px;width:14px;background:repeating-conic-gradient(var(--ink) 0 25%,var(--surface) 0 50%) 0 0/7px 7px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:16px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 10px;align-items:center}
.bar button[aria-pressed="true"]{background:var(--purple);color:#fff}
ul{list-style:none;margin:0;padding:0}
li.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--purple);border-radius:6px;padding:10px 12px;margin-bottom:8px}
li.task.done{border-left-color:var(--green);opacity:.65}li.task.done .t{text-decoration:line-through}
li.task.late{border-left-color:var(--red)}li.task.soon{border-left-color:var(--amber)}
.t{font-weight:600}.meta{font-size:13px;color:var(--mute)}
.chip{display:inline-block;background:var(--chip);border-radius:99px;padding:0 8px;font-size:12px;margin-right:6px;color:var(--ink)}
.due{text-align:right;font-size:14px;white-space:nowrap}.due b{display:block}
.late .due b{color:var(--red)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--green)}
.del{border:0;background:none;color:var(--mute);padding:2px 6px;font-size:13px;font-weight:500}
.empty{padding:24px;text-align:center;color:var(--mute);border:2px dashed var(--line);border-radius:6px}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand"><img class="logo" src="logo.png" alt="The Void Racers logo"><div><h1>The Void Racers</h1><p class="sub">Pit Wall: team deadline planner</p></div></div>
  <div class="count"><div class="big" id="days">–</div><div class="meta" id="daysLbl">Set your event date</div></div>
<div class="meta" id="who" style="width:100%"></div></header>
<div id="gate" class="panel"></div>
<div id="app" hidden>

<div class="stats" id="stats"></div>
<div class="track" id="track" aria-hidden="true"><div class="flag"></div></div>

<div class="panel">
  <div class="row">
    <div><label for="evName">Event</label><input id="evName" value="Regional final"></div>
    <div><label for="evDate">Event date</label><input id="evDate" type="date"></div>
    <div><button id="tpl" class="primary" style="width:100%">Load race-season template</button></div>
  </div>
</div>

<form class="panel" id="f" onsubmit="return false">
  <div class="row">
    <div style="grid-column:1/-1;min-width:200px"><label for="nt">Task</label><input id="nt" placeholder="e.g. Finish CFD report"></div>
    <div><label for="no">Owner</label><select id="no"></select></div>
    <div><label for="nc">Area</label><select id="nc"><option>Design &amp; CAD</option><option>Manufacturing</option><option>Testing</option><option>Portfolio</option><option>Enterprise</option><option>Presentation</option><option>Logistics</option></select></div>
    <div><label for="nd">Due date</label><input id="nd" type="date"></div>
    <div><button id="add" class="primary" style="width:100%">Add task</button></div>
  </div>
</form>

<div class="bar" id="filters" role="group" aria-label="Filter tasks"></div>
<div class="meta" id="msg" role="status"></div>
<ul id="list"></ul></div>
</div>

<script>
var ROSTER=["vkhahan","ialfarhan","vbudki","emusa","aputhoor"],LEAD="vkhahan",NAMES={vkhahan:"Vala Khahan",ialfarhan:"Ilyas Alfarhan",vbudki:"Vivaan Budki",emusa:"Ethan Musa",aputhoor:"Andrew Puthoor"};
function nm(u){return NAMES[u]||u}
var S={event:"Regional final",date:"",tasks:[],members:{},filter:"open"};
var ME={uid:null,name:null,owner:false},DB=null,armed=false,seeded=false;
var $=function(i){return document.getElementById(i)},DAY=864e5;
function today(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function diff(s){return Math.round((parse(s)-today())/DAY)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(s){return parse(s).toLocaleDateString(undefined,{day:"numeric",month:"short"})}
function rel(n){return n<0?Math.abs(n)+"d overdue":n===0?"Today":n===1?"Tomorrow":"In "+n+"d"}
function note(t){$("msg").textContent=t||""}
function err(e){note("Couldn’t sync: "+((e&&e.message)||e))}
function gate(h){$("gate").hidden=false;$("gate").innerHTML=h;$("app").hidden=true}

var TPL=[["Agree team roles and car identity","Enterprise",90],["Write design brief and regulation checklist","Design & CAD",84],["First CAD concept ready","Design & CAD",70],["CFD round 1 complete","Testing",60],["Send sponsorship proposals","Enterprise",60],["Print or machine prototype car","Manufacturing",45],["Track testing and data log","Testing",35],["Design freeze","Design & CAD",28],["Engineering portfolio draft","Portfolio",21],["Portfolio submission","Portfolio",14],["Pit display built","Enterprise",18],["Verbal presentation rehearsal","Presentation",10],["Scrutineering check on final car","Manufacturing",5],["Pack tools, spares and display","Logistics",2]];

$("no").innerHTML='<option value="">Unassigned</option>'+ROSTER.map(function(n){return'<option value="'+n+'">'+NAMES[n]+'</option>'}).join("");

/* ---- PASTE YOUR FIREBASE CONFIG HERE (see README.md) ---- */
var firebaseConfig={apiKey:"AIzaSyDrDhcOI5JHv9czKUG0EU5XGzJRrkTOA9Q",authDomain:"thevoidracers-84d0d.firebaseapp.com",projectId:"thevoidracers-84d0d",appId:"1:857579521383:web:ff46966bc509e323311bc2"};
/* ---------------------------------------------------------- */
var DOMAIN="@pitwall.team",auth,unsubs=[];
function loginForm(msg){
  gate('<h2>Sign in</h2><form id="lf" class="row"><div><label for="lu">Username (e.g. vkhahan)</label><input id="lu" autocomplete="username" required></div><div><label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" required></div><div><button class="primary" style="width:100%">Sign in</button></div></form><p class="meta" id="lm" role="alert">'+(msg||"")+'</p>');
  $("lf").onsubmit=function(e){e.preventDefault();var u=$("lu").value.trim().toLowerCase();
    if(ROSTER.indexOf(u)<0){$("lm").textContent="Unknown username.";return}
    auth.signInWithEmailAndPassword(u+DOMAIN,$("lp").value).catch(function(){$("lm").textContent="Wrong username or password."})};
}
function start(){
  if(firebaseConfig.apiKey.indexOf("PASTE")===0){gate("<h2>Setup needed</h2><p>Paste your Firebase config into index.html. See README.md.</p>");return}
  firebase.initializeApp(firebaseConfig);auth=firebase.auth();DB=firebase.firestore();
  auth.onAuthStateChanged(function(u){
    unsubs.forEach(function(f){f()});unsubs=[];
    if(!u){ME.name=null;loginForm();return}
    ME.name=u.email.split("@")[0];ME.owner=ME.name===LEAD;$("no").value=ME.name;
    $("gate").hidden=true;$("app").hidden=false;
    unsubs.push(DB.collection("tasks").onSnapshot(function(s){S.tasks=s.docs.map(function(d){var x=d.data();x.id=d.id;return x});render()},err));
    unsubs.push(DB.doc("settings/event").onSnapshot(function(s){var x=s.data()||{};S.event=x.name||S.event;S.date=x.date||"";if(document.activeElement!==$("evName"))$("evName").value=S.event;$("evDate").value=S.date;render()},err));
    render();
  });
}

$("evDate").onchange=function(){if(ME.owner)DB.doc("settings/event").set({name:S.event,date:this.value}).catch(err)};
$("evName").onchange=function(){if(ME.owner)DB.doc("settings/event").set({name:this.value,date:S.date}).catch(err)};
$("tpl").onclick=function(){
  if(!ME.owner)return;
  if(!S.date){note("Set the event date first so deadlines can be counted back from it.");return}
  if(S.tasks.length&&!armed){armed=true;note("You already have tasks. Click again to add the template anyway.");return}
  armed=false;note("");
  TPL.forEach(function(t){DB.collection("tasks").add({t:t[0],o:"",c:t[1],d:iso(new Date(parse(S.date).getTime()-t[2]*DAY)),done:false}).catch(err)})};
$("add").onclick=function(){
  var t=$("nt").value.trim();
  if(!t||!$("nd").value){note("Add a task name and a due date.");return}
  note("");DB.collection("tasks").add({t:t,o:$("no").value,c:$("nc").value,d:$("nd").value,done:false,by:ME.name}).catch(err);
  $("nt").value="";$("nt").focus()};

function render(){
  if(!ME.name)return;
  var n=S.date?diff(S.date):null;
  $("days").textContent=n===null?"–":n<0?"Done":n;
  $("daysLbl").textContent=n===null?"Waiting for the event date":n<0?S.event+" has passed":"days to "+S.event;
  $("evName").closest(".panel").hidden=!ME.owner;
  var team="";
  team=' · <button class="del" id="out">Sign out</button>';
  $("who").innerHTML="Signed in as <b>"+esc(nm(ME.name))+"</b>"+(ME.owner?" (owner)":"")+team;
  $("out").onclick=function(){auth.signOut()};
  var T=S.tasks,done=T.filter(function(x){return x.done}).length;
  var late=T.filter(function(x){return!x.done&&diff(x.d)<0}).length;
  var week=T.filter(function(x){var k=diff(x.d);return!x.done&&k>=0&&k<=7}).length;
  $("stats").innerHTML=[[T.length?Math.round(done/T.length*100)+"%":"0%","Complete"],[T.length-done,"Open tasks"],[week,"Due in 7 days"],[late,"Overdue"]].map(function(s){return'<div class="stat"><b>'+s[0]+'</b><span>'+s[1]+'</span></div>'}).join("");
  var start=today(),end=S.date?parse(S.date):null,tk="";
  if(end&&end>start){T.forEach(function(x){var p=Math.min(100,Math.max(0,(parse(x.d)-start)/(end-start)*100));tk+='<span class="tick'+(x.done?" done":diff(x.d)<0?" late":"")+'" style="left:'+p+'%" title="'+esc(x.t)+'"></span>'})}
  $("track").innerHTML='<div class="flag"></div>'+tk;
  var F=[["open","Open"],["mine","Mine"],["late","Overdue"],["done","Done"],["all","All"]];
  $("filters").innerHTML=F.map(function(f){return'<button data-f="'+f[0]+'" aria-pressed="'+(S.filter===f[0])+'">'+f[1]+'</button>'}).join("");
  Array.prototype.forEach.call($("filters").children,function(b){b.onclick=function(){S.filter=b.dataset.f;render()}});
  var L=T.slice().sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0}).filter(function(x){var f=S.filter;
    return f==="all"||(f==="open"&&!x.done)||(f==="done"&&x.done)||(f==="late"&&!x.done&&diff(x.d)<0)||(f==="mine"&&!x.done&&x.o===ME.name)});
  $("list").innerHTML=L.length?L.map(function(x){var k=diff(x.d);
    var cls="task"+(x.done?" done":k<0?" late":k<=7?" soon":"");
    return'<li class="'+cls+'"><input type="checkbox" data-id="'+x.id+'" aria-label="Mark done: '+esc(x.t)+'"'+(x.done?" checked":"")+'>'
    +'<div><div class="t">'+esc(x.t)+'</div><div class="meta"><span class="chip">'+esc(x.c)+'</span>'+(x.o?esc(nm(x.o)):"Unassigned")+(x.done&&x.doneBy?" · done by "+esc(nm(x.doneBy)):"")+(ME.owner?' <button class="del" data-del="'+x.id+'">Delete</button>':"")+'</div></div>'
    +'<div class="due"><b>'+(x.done?"Done":rel(k))+'</b>'+fmt(x.d)+'</div></li>'}).join("")
    :'<li class="empty">'+(T.length?"Nothing here. Try another filter.":"No tasks yet. "+(ME.owner?"Set the event date and load the template, or add the first task above.":"Add the first task above."))+'</li>';
  Array.prototype.forEach.call(document.querySelectorAll("[data-id]"),function(c){c.onchange=function(){DB.doc("tasks/"+c.dataset.id).update({done:c.checked,doneBy:c.checked?ME.name:""}).catch(err)}});
  Array.prototype.forEach.call(document.querySelectorAll("[data-del]"),function(b){b.onclick=function(){DB.doc("tasks/"+b.dataset.del).delete().catch(err)}});
}
start();
</script>
</body>
</html>
